#
# Fast CI for the DuckDB AI extension.
#
# Code and test changes run formatting, clang-tidy, release build, SQLLogicTests,
# and deterministic provider smokes. The Jev cookbook is included because its
# SQL is executed by the mock smoke suite. The function reference is included
# because docs_coverage_smoke.py checks it against the registered functions.
# The chaining cookbook is included because chaining_smoke.py runs its SQL.
# macOS/Windows and owned-code sanitizers run on every change; the full
# distribution matrix remains manual.
#
name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/MainDistributionPipeline.yml'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - 'duckdb'
      - 'extension-ci-tools'
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/cookbooks/jev-decisions.md'
      - 'docs/functions.md'
      - 'docs/cookbooks/chain-ai-steps.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/MainDistributionPipeline.yml'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - 'duckdb'
      - 'extension-ci-tools'
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/cookbooks/jev-decisions.md'
      - 'docs/functions.md'
      - 'docs/cookbooks/chain-ai-steps.md'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      distribution:
        description: Run the full DuckDB extension distribution build
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GEN: ninja
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-22.04
    env:
      CC: gcc-10
      CXX: g++-10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/MainDistributionPipeline.yml

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-format-11
          python -m pip install --upgrade pip
          python -m pip install cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'

      - name: Run format check
        shell: bash
        run: |
          clang-format --version
          black --version
          make format-check

  tidy-check:
    name: Tidy check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      TIDY_THREADS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/MainDistributionPipeline.yml

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-tidy-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'vcpkg.json', 'src/**', 'duckdb/CMakeLists.txt', 'extension-ci-tools/makefiles/duckdb_extension.Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-tidy-${{ github.ref_name }}-
            ccache-${{ runner.os }}-tidy-

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-tidy libcurl4-openssl-dev ccache
          python -m pip install --upgrade pip
          python -m pip install 'pybind11[global]'

      - name: Run tidy check
        shell: bash
        run: |
          ccache --zero-stats || true
          make tidy-check-ai

      - name: Show ccache stats
        if: always()
        shell: bash
        run: ccache --show-stats || true

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-build-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'vcpkg.json', 'src/**', 'test/**', 'duckdb/CMakeLists.txt', 'extension-ci-tools/makefiles/duckdb_extension.Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-build-${{ github.ref_name }}-
            ccache-${{ runner.os }}-build-

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build libcurl4-openssl-dev ccache openssl

      - name: Build release extension
        shell: bash
        run: |
          ccache --zero-stats || true
          make release

      - name: Run SQLLogicTests
        shell: bash
        run: make test

      - name: Run mock-provider smoke test
        shell: bash
        run: |
          python3 test/smoke/mock_provider_smoke.py
          python3 test/smoke/docs_coverage_smoke.py
          python3 test/smoke/decision_providers_smoke.py
          python3 test/smoke/chaining_smoke.py
          python3 test/smoke/extension_upload_smoke.py
          python3 test/smoke/resumable_enrichment_smoke.py
          python3 test/smoke/jev_batch_evaluation_smoke.py
          python3 test/smoke/accuracy_gate_smoke.py
          python3 test/smoke/reliability_smoke.py --library build/release/src/libduckdb.so

      - name: Run owned-code ASan and UBSan checks
        shell: bash
        run: |
          cmake -G Ninja -S duckdb -B build/release -DAI_ENABLE_SANITIZERS=ON
          cmake --build build/release --target ai_loadable_extension -j2
          curl --fail --location https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.gz | gzip -d > build/release/duckdb-host
          chmod +x build/release/duckdb-host
          python3 test/smoke/sanitizer_smoke.py --duckdb build/release/duckdb-host --extension build/release/extension/ai/ai.duckdb_extension

      - name: Show ccache stats
        if: always()
        shell: bash
        run: ccache --show-stats || true

  platform-checks:
    name: Platform checks
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: ai
      reduced_ci_mode: 'enabled'
      exclude_archs: 'linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      artifact_postfix: '-platform-check'

  repository-checks:
    name: Repository checks
    if: always()
    needs: [format-check, tidy-check, build-test, platform-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          failed = [name for name, check in results.items() if check['result'] != 'success']
          if failed:
              raise SystemExit('Failed or skipped checks: ' + ', '.join(failed))
          PY

  distribution-build:
    name: Distribution build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribution }}
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: ai
